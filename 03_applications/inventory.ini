# Application inventory - example configuration
# Each group maps to a group_vars/<name>.yaml application contract.
# Hosts are the guests (LXC/VM) provisioned in 02_lxc / 02_vm.
# If a guest is only reachable through the Proxmox node, use a
# ProxyCommand jump, e.g.:
#   ansible_ssh_common_args='-o ProxyCommand="ssh -i files/ssh_keys/cluster -W %h:%p root@pve0.example.lan"'

[wordpress]
wordpress.example.lan ansible_host=192.0.2.126 ansible_user=youruser ansible_ssh_private_key_file=files/ssh_keys/cluster

[pihole]
pihole.example.lan ansible_host=192.0.2.11 ansible_user=youruser
