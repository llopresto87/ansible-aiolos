---
# openwrt_services — enable/disable and start/stop init.d services
# Uses /etc/init.d/<service> enable/disable and start/stop commands.
# Idempotent: checks /etc/rc.d/ symlink state before acting.

- name: Validate services contract
  ansible.builtin.assert:
    that:
      - openwrt_services is defined
    fail_msg: >-
      openwrt_services dict must be defined with enable/disable lists

- name: Enable and start services
  ansible.builtin.shell: |
    if [ ! -f /etc/init.d/{{ item }} ]; then
      echo "SKIP: /etc/init.d/{{ item }} not found"
      exit 0
    fi
    /etc/init.d/{{ item }} enable 2>/dev/null
    /etc/init.d/{{ item }} start 2>/dev/null || true
    echo "ENABLED"
  register: openwrt_services_openwrt_svc_enable
  changed_when: "'ENABLED' in openwrt_services_openwrt_svc_enable.stdout"
  loop: "{{ openwrt_services.enable | default([]) }}"

- name: Disable and stop services
  ansible.builtin.shell: |
    if [ ! -f /etc/init.d/{{ item }} ]; then
      echo "SKIP: /etc/init.d/{{ item }} not found"
      exit 0
    fi
    /etc/init.d/{{ item }} stop 2>/dev/null || true
    /etc/init.d/{{ item }} disable 2>/dev/null
    echo "DISABLED"
  register: openwrt_services_openwrt_svc_disable
  changed_when: "'DISABLED' in openwrt_services_openwrt_svc_disable.stdout"
  loop: "{{ openwrt_services.disable | default([]) }}"
