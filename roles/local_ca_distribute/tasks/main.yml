---
- name: Bootstrap local CA artifacts on control node
  ansible.builtin.include_role:
    name: local_ca_bootstrap
  run_once: true
  when:
    - local_ca_distribute_enabled | bool
    - local_ca_distribute_run_bootstrap | bool

- name: Resolve CA distribution OS family
  ansible.builtin.set_fact:
    local_ca_distribute_resolved_os_family: >-
      {{ local_ca_distribute_target_os_family
      | default(ansible_os_family
      | default(host_distro_type
      | default(os | default('Debian'))), true)
      | lower }}
  when: local_ca_distribute_enabled | bool

- name: Validate local CA certificate exists on control node
  ansible.builtin.stat:
    path: "{{ local_ca_distribute_source_cert_path }}"
  register: local_ca_distribute_source_cert_stat
  delegate_to: localhost
  become: false
  run_once: true
  when: local_ca_distribute_enabled | bool

- name: Assert local CA certificate is available
  ansible.builtin.assert:
    that:
      - >-
        local_ca_distribute_source_cert_stat.stat.exists
        or (ansible_check_mode and local_ca_distribute_run_bootstrap | bool)
    fail_msg: >-
      Local CA certificate not found at
      {{ local_ca_distribute_source_cert_path }}.
      Run local_ca_bootstrap or adjust
      local_ca_distribute_source_cert_path.
  run_once: true
  when: local_ca_distribute_enabled | bool

- name: Include Debian CA trust tasks
  ansible.builtin.include_tasks: debian.yml
  when:
    - local_ca_distribute_enabled | bool
    - local_ca_distribute_resolved_os_family in ['debian', 'ubuntu']

- name: Include RedHat CA trust tasks
  ansible.builtin.include_tasks: redhat.yml
  when:
    - local_ca_distribute_enabled | bool
    - local_ca_distribute_resolved_os_family in ['redhat', 'rhel', 'centos', 'rocky', 'almalinux']

- name: Include OpenWrt CA trust tasks
  ansible.builtin.include_tasks: openwrt.yml
  when:
    - local_ca_distribute_enabled | bool
    - local_ca_distribute_resolved_os_family in ['openwrt']

- name: Warn when OS family is unsupported for CA distribution
  ansible.builtin.debug:
    msg: >-
      local_ca_distribute has no implementation for OS family
      '{{ local_ca_distribute_resolved_os_family }}';
      skipping trust update.
  when:
    - local_ca_distribute_enabled | bool
    - local_ca_distribute_resolved_os_family not in
      ['debian', 'ubuntu', 'redhat', 'rhel', 'centos', 'rocky', 'almalinux', 'openwrt']
