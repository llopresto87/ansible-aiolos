options i915 enable_rc6=7

options i915 enable_guc=0 # Disables GuC/HuC firmware loading

options i915 enable_gvt=0 # Disables Intel GVT-g graphics virtualization host support

options i915 enable_dc=2 # Enables up to DC6, which is a deeper power-saving state

options i915 enable_fbc=1 # Enables frame buffer compression to save power

options i915 enable_psr=2 # Enables Panel Self Refresh up to PSR2 for power saving

options i915 disable_power_well=1 # Disables power wells when possible to save power

options i915 enable_ips=1 # Enables Intermediate Pixel Storage for power savings

options i915 fastboot=1 # Skips unnecessary mode sets at boot time

options i915 enable_dp_mst=0 # Disables multi-stream transport to save power

options i915 enable_dpcd_backlight=1 # Enables DPCD backlight control

options i915 mitigations=off # Disables security mitigations for additional power saving
