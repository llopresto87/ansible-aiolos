---
- name: Preview Proxmox network configuration
  hosts: all
  gather_facts: false
  vars:
    network_interfaces_template: >-
      roles/proxmox_network_interfaces/templates/interfaces.j2
    generated_network_preview: generated/interfaces
  tasks:
    - name: Generate network configuration preview locally
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../{{ network_interfaces_template }}"
        dest: "{{ playbook_dir }}/../../{{ generated_network_preview }}"
        mode: '0644'
      delegate_to: localhost
