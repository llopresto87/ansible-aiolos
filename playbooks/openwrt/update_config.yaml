---
# Config-only update for an OpenWrt device.
# Pushes config files and restarts services without reinstalling packages.
#
# Usage:
#   ansible-playbook -i 04_openwrt/inventory.ini \
#     playbooks/openwrt/update_config.yaml

- name: Update OpenWrt configuration
  hosts: all
  gather_facts: false
  roles:
    - openwrt_raw_config
    - openwrt_services
